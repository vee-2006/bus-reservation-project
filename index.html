<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Reservation System</title>

  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: Consolas, "Lucida Console", Monaco, monospace;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .header {
      margin-top: 20px;
      margin-bottom: 12px;
    }

    .header h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 32px;
    }

    .header p {
      margin: 6px 0 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .emscripten {
      margin-left: auto;
      margin-right: auto;
      display: block;
      text-align: center;
    }

    .emscripten_border {
      width: 95%;
      max-width: 1400px;
      margin: 15px auto 10px auto;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
      box-sizing: border-box;
    }

    /* Keep canvas border/padding zero for correct mouse coordinates */
    canvas.emscripten {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      background-color: black;
      outline: none;
    }

    #emscripten_logo {
      display: inline-block;
      margin-top: 10px;
      width: 220px;
      max-width: 80%;
    }

    .spinner {
      height: 30px;
      width: 30px;
      margin: 15px auto 8px auto;
      display: block;
      border: 4px solid #1e293b;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      background-color: transparent;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      margin-top: 8px;
      margin-bottom: 10px;
      font-weight: bold;
      color: #cbd5e1;
      font-size: 17px;
    }

    #progress {
      width: 300px;
      max-width: 80%;
      height: 18px;
      margin-bottom: 10px;
    }

    #controls {
      display: block;
      margin: 10px auto 14px auto;
      color: #e2e8f0;
      font-size: 14px;
    }

    #controls span {
      margin: 0 10px;
      white-space: nowrap;
    }

    #controls input[type="button"] {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #controls input[type="button"]:hover {
      background: #7dd3fc;
    }

    #output {
      width: 95%;
      max-width: 1400px;
      height: 220px;
      margin: 12px auto 24px auto;
      display: block;
      background-color: #020617;
      color: #22c55e;
      font-family: Consolas, "Lucida Console", Monaco, monospace;
      font-size: 16px;
      line-height: 1.35;
      padding: 12px;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }
  </style>
</head>

  <div class="spinner" id="spinner"></div>
  <div class="emscripten" id="status">Downloading...</div>

  <span id="controls">
    <span><input type="checkbox" id="resize"> Resize canvas</span>
    <span><input type="checkbox" id="pointerLock" checked> Lock/hide mouse pointer</span>
    <span>
      <input
        type="button"
        value="Fullscreen"
        onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
    </span>
  </span>

  <div class="emscripten">
    <progress value="0" max="100" id="progress" hidden="1"></progress>
  </div>

  <div class="emscripten_border">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <textarea id="output" rows="8" readonly></textarea>

  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var canvasElement = document.getElementById('canvas');
    var outputElement = document.getElementById('output');

    if (outputElement) outputElement.value = '';

    canvasElement.addEventListener('webglcontextlost', function (e) {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);

    var setStatus = function (text) {
      if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
      if (text === setStatus.last.text) return;

      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - setStatus.last.time < 30) return;

      setStatus.last.time = now;
      setStatus.last.text = text;

      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2], 10) * 100;
        progressElement.max = parseInt(m[4], 10) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }

      statusElement.innerHTML = text;
    };

    var Module = {
      print: function () {
        var args = Array.prototype.slice.call(arguments);
        console.log.apply(console, args);
        if (outputElement) {
          var text = args.join(' ');
          outputElement.value += text + "\n";
          outputElement.scrollTop = outputElement.scrollHeight;
        }
      },
      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left
          ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };

    setStatus('Downloading...');

    window.onerror = function () {
      setStatus('Exception thrown, see JavaScript console');
      spinnerElement.style.display = 'none';
      setStatus = function (text) {
        if (text) console.error('[post-exception status] ' + text);
      };
    };
  </script>

  <script async type="text/javascript" src="index.js"></script>
